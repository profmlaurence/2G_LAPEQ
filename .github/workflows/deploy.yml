name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  AR_REPO: ${{ secrets.AR_REPO }}          # nome do repositório no Artifact Registry
  IMAGE_NAME: lapeq-app
  GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
  GCP_WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  CLOUD_RUN_SERVICE_ACCOUNT: ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }}
  STREAMLIT_SECRET_NAME: streamlit-secrets

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Build: constrói a imagem Docker e faz push ao Artifact Registry
  #    Usa cache de camadas para acelerar builds subsequentes.
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: tags
        run: |
          BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          echo "versioned=${BASE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "cache=${BASE}:cache"                 >> "$GITHUB_OUTPUT"

      - name: Build and push (with layer cache)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.versioned }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to:   type=registry,ref=${{ steps.tags.outputs.cache }},mode=max

    outputs:
      # digest garante que o deploy usa exatamente a imagem construída acima
      image: ${{ steps.tags.outputs.versioned }}@${{ steps.build.outputs.digest }}

  # ──────────────────────────────────────────────────────────────
  # 2. Deploy: atualiza secret no Secret Manager e implanta no Cloud Run
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Update Secret & Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Ensure Secret Manager secret exists
        run: |
          if ! gcloud secrets describe "$STREAMLIT_SECRET_NAME" \
               --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            printf 'placeholder' | gcloud secrets create "$STREAMLIT_SECRET_NAME" \
              --project "$GCP_PROJECT_ID" \
              --replication-policy=automatic \
              --data-file=-
          fi

      - name: Update Streamlit secrets
        env:
          STREAMLIT_SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          [ -n "$STREAMLIT_SECRETS_TOML" ] || { echo "STREAMLIT_SECRETS_TOML secret ausente"; exit 1; }
          printf '%s' "$STREAMLIT_SECRETS_TOML" > /tmp/secrets.toml
          gcloud secrets versions add "$STREAMLIT_SECRET_NAME" \
            --project "$GCP_PROJECT_ID" \
            --data-file=/tmp/secrets.toml
          rm -f /tmp/secrets.toml

      - name: Grant Cloud Run SA access to Secret Manager
        run: |
          [ -n "$CLOUD_RUN_SERVICE_ACCOUNT" ] || { echo "CLOUD_RUN_SERVICE_ACCOUNT secret ausente"; exit 1; }
          gcloud secrets add-iam-policy-binding "$STREAMLIT_SECRET_NAME" \
            --project "$GCP_PROJECT_ID" \
            --member="serviceAccount:$CLOUD_RUN_SERVICE_ACCOUNT" \
            --role="roles/secretmanager.secretAccessor"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "${{ needs.build.outputs.image }}" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$CLOUD_RUN_SERVICE_ACCOUNT" \
            --update-secrets /root/.streamlit/secrets.toml="$STREAMLIT_SECRET_NAME":latest,/app/.streamlit/secrets.toml="$STREAMLIT_SECRET_NAME":latest,STREAMLIT_SECRETS_TOML="$STREAMLIT_SECRET_NAME":latest

      - name: Show service URL
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)'
